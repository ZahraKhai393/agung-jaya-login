<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agung Jaya Listrik - SPH & Invoice Generator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: radial-gradient(circle at 50% 30%, #3a1c22 0%, #151922 60%, #0d1117 100%);
            font-family: system-ui, -apple-system, sans-serif;
        }
        .glass-card {
            background: rgba(25, 30, 42, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        .glass-input {
            background: rgba(15, 20, 30, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-input:focus {
            border-color: rgba(239, 68, 68, 0.6);
            box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden text-slate-200">

    <!-- Efek Cahaya Dekoratif Latar Belakang -->
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-red-600/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-rose-900/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Kotak Utama Login -->
    <div class="glass-card w-full max-w-[420px] rounded-3xl p-8 sm:p-10 relative z-10 flex flex-col items-center">
        
        <!-- Kotak Logo (Menggunakan Gambar Asli) -->
        <div class="w-20 h-20 bg-white rounded-2xl flex items-center justify-center shadow-lg shadow-red-600/30 mb-6 border border-red-500/30 overflow-hidden p-2">
            <!-- Ganti 'logo.png' dengan nama file gambar logomu jika berbeda -->
            <img src="logoAJL.png" alt="Logo Agung Jaya Listrik" class="w-full h-full object-contain">
        </div>

        <!-- Judul & Subjudul -->
        <h1 class="text-2xl font-bold text-white tracking-wide text-center">Agung Jaya Listrik</h1>

<form class="w-full space-y-5" onsubmit="handleLogin(event)">
    
    <!-- Input Email -->
    <div class="space-y-1.5">
        <label class="block text-xs font-semibold text-slate-300 tracking-wide">Email</label>
        <div class="relative flex items-center">
            <span class="absolute left-4 text-slate-400 text-sm">@</span>
            <input type="email" required placeholder="email@example.com" 
                class="glass-input w-full rounded-xl py-3 pl-10 pr-4 text-sm text-white placeholder-slate-500 focus:outline-none transition-all">
        </div>
    </div>

    <!-- Input Password -->
    <div class="space-y-1.5">
        <label class="block text-xs font-semibold text-slate-300 tracking-wide">Password</label>
        <div class="relative flex items-center">
            <span class="absolute left-4 text-slate-400 text-sm"><i class="fa-solid fa-lock text-xs"></i></span>
            <input type="password" required placeholder="••••••••" 
                class="glass-input w-full rounded-xl py-3 pl-10 pr-10 text-sm text-white placeholder-slate-500 focus:outline-none transition-all">
        </div>
    </div>

    <!-- Tombol Login -->
    <button type="submit" class="w-full mt-2 bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 text-white font-medium py-3 px-4 rounded-xl shadow-lg shadow-red-600/30 transition-all duration-200 flex items-center justify-center space-x-2 group">
        <span>Login</span>
        <i class="fa-solid fa-arrow-right text-xs group-hover:translate-x-1 transition-transform"></i>
    </button>
</form>

<script>
    function handleLogin(e) {
        e.preventDefault(); // Mencegah form melakukan refresh halaman bawaan
        
        // Langsung arahkan ke halaman dashboard
        window.location.href = "dashboard.html";
    }
</script>
