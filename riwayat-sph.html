<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat SPH - Agung Jaya Listrik</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b0f17; font-family: system-ui, -apple-system, sans-serif; }
        .card-dark { background: rgba(17, 24, 38, 0.7); border: 1px solid rgba(255, 255, 255, 0.06); }
        .glass-input { background: rgba(13, 17, 23, 0.8); border: 1px solid rgba(255, 255, 255, 0.08); color: white; }
    </style>
</head>
<body class="min-h-screen text-slate-200">
    <header class="border-b border-slate-800 bg-[#0b0f17]/90 backdrop-blur sticky top-0 z-50 px-6 py-3.5 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center overflow-hidden p-1 shadow">
                <img src="logoAJL.png" alt="Logo" class="w-full h-full object-contain">
            </div>
            <div>
                <h1 class="text-white font-bold text-sm tracking-wide">Agung Jaya Listrik</h1>
                <p class="text-[10px] text-slate-400">Invoice & Dokumen</p>
            </div>
        </div>
        <nav class="hidden md:flex items-center space-x-1 text-sm font-medium">
            <a href="dashboard.html" class="px-3 py-1.5 rounded-lg text-slate-300 hover:text-white transition">Dashboard</a>
            <a href="sph.html" class="px-3 py-1.5 rounded-lg text-slate-300 hover:text-white transition">Buat SPH</a>
            <a href="riwayat-sph.html" class="px-3 py-1.5 rounded-lg bg-red-600/20 text-red-500 font-semibold border border-red-500/30">Riwayat SPH</a>
        </nav>
        <a href="index.html" class="px-3 py-1.5 rounded-lg card-dark text-xs text-slate-300 hover:text-white flex items-center space-x-2">
            <i class="fa-solid fa-right-from-bracket"></i><span>Logout</span>
        </a>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-8">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h2 class="text-2xl font-bold text-white tracking-tight">Riwayat SPH</h2>
                <p id="jumlahData" class="text-xs text-slate-400 mt-1">Memuat data...</p>
            </div>
            <a href="sph.html" class="bg-rose-500 hover:bg-rose-600 text-white px-4 py-2.5 rounded-xl text-xs font-semibold transition flex items-center space-x-2">
                <i class="fa-solid fa-plus"></i><span>Buat SPH</span>
            </a>
        </div>

        <div class="relative mb-6">
            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-500"><i class="fa-solid fa-magnifying-glass text-xs"></i></span>
            <input type="text" id="inputCari" onkeyup="filterData()" placeholder="Cari nomor surat atau nama perusahaan..." class="glass-input w-full rounded-xl pl-11 pr-4 py-3 text-xs">
        </div>

        <div class="card-dark rounded-2xl overflow-hidden border border-slate-800/80">
            <table class="w-full text-left border-collapse text-xs">
                <thead>
                    <tr class="border-b border-slate-800 text-slate-400 uppercase text-[10px] tracking-wider bg-slate-900/40">
                        <th class="py-4 px-6 w-16 text-center">#</th>
                        <th class="py-4 px-6">Nomor Surat</th>
                        <th class="py-4 px-6">Nama Perusahaan</th>
                        <th class="py-4 px-6">Tanggal</th>
                        <th class="py-4 px-6 text-center w-36">Aksi</th>
                    </tr>
                </thead>
                <tbody id="tabelBody" class="divide-y divide-slate-800/40 text-slate-300"></tbody>
            </table>
        </div>
    </main>

    <script>
        function getStoredData() {
            return JSON.parse(localStorage.getItem('data_sph')) || [];
        }

        function renderTabel(data) {
            const tbody = document.getElementById('tabelBody');
            document.getElementById('jumlahData').innerText = `${data.length} penawaran harga ditemukan`;
            
            if(data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-10 text-slate-500">Belum ada riwayat SPH yang disimpan. Silakan buat SPH baru terlebih dahulu.</td></tr>`;
                return;
            }

            let html = '';
            data.forEach((item, index) => {
                html += `
                    <tr class="hover:bg-slate-800/20 transition">
                        <td class="py-4 px-6 text-center text-slate-500 font-mono">${index + 1}</td>
                        <td class="py-4 px-6 font-bold text-white font-mono">${item.no}</td>
                        <td class="py-4 px-6 font-medium text-slate-200">${item.perusahaan}</td>
                        <td class="py-4 px-6 text-slate-400">${item.tanggal}</td>
                        <td class="py-4 px-6 text-center">
                            <div class="flex items-center justify-center space-x-4 text-slate-400">
                                <button onclick="cetakItem()" title="Download PDF" class="hover:text-blue-400 transition"><i class="fa-solid fa-file-arrow-down"></i></button>
                                <button onclick="hapusItem(${item.id})" title="Hapus" class="hover:text-red-400 transition"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        function filterData() {
            const keyword = document.getElementById('inputCari').value.toLowerCase();
            const data = getStoredData();
            const filtered = data.filter(item => 
                item.no.toLowerCase().includes(keyword) || item.perusahaan.toLowerCase().includes(keyword)
            );
            renderTabel(filtered);
        }

        function hapusItem(id) {
            if(confirm("Apakah kamu yakin ingin menghapus data ini dari riwayat?")) {
                let data = getStoredData();
                data = data.filter(item => item.id !== id);
                localStorage.setItem('data_sph', JSON.stringify(data));
                renderTabel(data);
            }
        }

        function cetakItem() {
            window.print();
        }

        // Muat data saat halaman dibuka
        renderTabel(getStoredData());
    </script>
</body>
</html>
