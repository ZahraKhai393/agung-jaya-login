<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat SPH - Agung Jaya Listrik</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0b0f17;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .card-dark {
            background: rgba(17, 24, 38, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .glass-input {
            background: rgba(13, 17, 23, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: white;
        }
        .glass-input:focus {
            border-color: rgba(239, 68, 68, 0.6);
            outline: none;
        }
    </style>
</head>
<body class="min-h-screen text-slate-200">

    <!-- Header / Navbar -->
    <header class="border-b border-slate-800 bg-[#0b0f17]/90 backdrop-blur sticky top-0 z-50 px-6 py-3.5 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center overflow-hidden p-1 shadow">
                <img src="logoAJL.png" alt="Logo" class="w-full h-full object-contain">
            </div>
            <div>
                <h1 class="text-white font-bold text-sm tracking-wide">Agung Jaya Listrik</h1>
                <p class="text-[10px] text-slate-400">Invoice & Dokumen</p>
            </div>
        </div>

        <nav class="hidden md:flex items-center space-x-1 text-sm font-medium">
            <a href="dashboard.html" class="px-3 py-1.5 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/60 transition">Dashboard</a>
            <a href="#" class="px-3 py-1.5 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/60 transition">Inventory</a>
            <a href="#" class="px-3 py-1.5 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/60 transition">Jadwal</a>
            <a href="#" class="px-3 py-1.5 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/60 transition">Pengeluaran</a>
            <a href="#" class="px-3 py-1.5 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/60 transition">Laporan</a>
            <a href="sph.html" class="px-3 py-1.5 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/60 transition">Buat Dokumen <i class="fa-solid fa-chevron-down text-[10px] ml-1"></i></a>
            <a href="riwayat-sph.html" class="px-3 py-1.5 rounded-lg bg-red-600/20 text-red-500 font-semibold border border-red-500/30">Riwayat <i class="fa-solid fa-chevron-down text-[10px] ml-1"></i></a>
        </nav>

        <div class="flex items-center space-x-3">
            <button class="w-9 h-9 rounded-lg bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-400 hover:text-white">
                <i class="fa-solid fa-sun text-xs text-amber-400"></i>
            </button>
            <a href="index.html" class="px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-xs text-slate-300 hover:text-white flex items-center space-x-2">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Logout</span>
            </a>
        </div>
    </header>

    <!-- Konten Utama Riwayat SPH -->
    <main class="max-w-7xl mx-auto px-6 py-8">
        
        <!-- Header Judul & Tombol Buat SPH -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
            <div>
                <h2 class="text-2xl font-bold text-white tracking-tight">Riwayat SPH</h2>
                <p id="jumlahData" class="text-xs text-slate-400 mt-1">61 penawaran harga ditemukan</p>
            </div>
            <a href="sph.html" class="bg-rose-500 hover:bg-rose-600 text-white px-4 py-2.5 rounded-xl text-xs font-semibold transition shadow-lg shadow-rose-500/20 flex items-center justify-center space-x-2 w-fit">
                <i class="fa-solid fa-plus"></i>
                <span>Buat SPH</span>
            </a>
        </div>

        <!-- Kolom Pencarian -->
        <div class="relative mb-6">
            <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-slate-500">
                <i class="fa-solid fa-magnifying-glass text-xs"></i>
            </span>
            <input type="text" id="inputCari" onkeyup="filterData()" placeholder="Cari nomor surat atau nama perusahaan..." class="glass-input w-full rounded-xl pl-11 pr-4 py-3 text-xs">
        </div>

        <!-- Tabel Data Riwayat SPH -->
        <div class="card-dark rounded-2xl overflow-hidden border border-slate-800/80">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs">
                    <thead>
                        <tr class="border-b border-slate-800 text-slate-400 uppercase text-[10px] tracking-wider bg-slate-900/40">
                            <th class="py-4 px-6 w-16 text-center">#</th>
                            <th class="py-4 px-6">Nomor Surat</th>
                            <th class="py-4 px-6">Nama Perusahaan</th>
                            <th class="py-4 px-6">Tanggal</th>
                            <th class="py-4 px-6 text-center w-36"></th>
                        </tr>
                    </thead>
                    <tbody id="tabelBody" class="divide-y divide-slate-800/40 text-slate-300">
                        <!-- Data dimasukkan via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Skrip Data & Interaksi -->
    <script>
        let dataSPH = [
            { id: 1, no: "008/10/SPH/2026", perusahaan: "PT. Arisamandiri Pratama", sub: "Kudus", tanggal: "27 Okt 2026" },
            { id: 2, no: "007/10/SPH/2026", perusahaan: "Pak Hisyam", sub: "Maluku", tanggal: "22 Okt 2026" },
            { id: 3, no: "006/10/SPH/2026", perusahaan: "PT. Satya Energi Solusi", sub: "", tanggal: "19 Okt 2026" },
            { id: 4, no: "004/10/SPH/2026", perusahaan: "PT. Tirtamartandika Raharja", sub: "", tanggal: "15 Okt 2026" },
            { id: 5, no: "003/10/SPH/2026", perusahaan: "PT. Republika Mandiri Energi", sub: "", tanggal: "15 Okt 2026" },
            { id: 6, no: "002/10/SPH/2026", perusahaan: "PT. Primordia Siparup Perkasa", sub: "", tanggal: "13 Okt 2026" },
            { id: 7, no: "001/10/SPH/2026", perusahaan: "PT. Lintech Duta Pratama", sub: "", tanggal: "6 Okt 2026" },
            { id: 8, no: "011/09/SPH/2026", perusahaan: "Pak Lazuardi", sub: "", tanggal: "29 Sep 2026" }
        ];

        function renderTabel(data) {
            const tbody = document.getElementById('tabelBody');
            document.getElementById('jumlahData').innerText = `${data.length + 53} penawaran harga ditemukan`;
            
            if(data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-slate-500">Tidak ada penawaran harga ditemukan</td></tr>`;
                return;
            }

            let html = '';
            data.forEach((item, index) => {
                let subText = item.sub ? `<span class="block text-[11px] text-slate-500 mt-0.5">${item.sub}</span>` : '';
                html += `
                    <tr class="hover:bg-slate-800/20 transition">
                        <td class="py-4 px-6 text-center text-slate-500 font-mono">${index + 1}</td>
                        <td class="py-4 px-6 font-bold text-white font-mono">${item.no}</td>
                        <td class="py-4 px-6 font-medium text-slate-200">
                            ${item.perusahaan}
                            ${subText}
                        </td>
                        <td class="py-4 px-6 text-slate-400">${item.tanggal}</td>
                        <td class="py-4 px-6 text-center">
                            <div class="flex items-center justify-end space-x-4 text-slate-400">
                                <button onclick="cetakItem('${item.no}')" title="Download / Cetak" class="hover:text-blue-400 transition"><i class="fa-solid fa-file-arrow-down"></i></button>
                                <button onclick="editItem(${item.id})" title="Edit" class="hover:text-amber-400 transition"><i class="fa-solid fa-pen-to-square"></i></button>
                                <button onclick="hapusItem(${item.id})" title="Hapus" class="hover:text-red-400 transition"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        function filterData() {
            const keyword = document.getElementById('inputCari').value.toLowerCase();
            const filtered = dataSPH.filter(item => 
                item.no.toLowerCase().includes(keyword) || item.perusahaan.toLowerCase().includes(keyword)
            );
            renderTabel(filtered);
        }

        function hapusItem(id) {
            if(confirm("Apakah kamu yakin ingin menghapus data SPH ini?")) {
                dataSPH = dataSPH.filter(item => item.id !== id);
                renderTabel(dataSPH);
            }
        }

        function cetakItem(noSurat) {
            window.location.href = 'sph.html';
        }

        function editItem(id) {
            window.location.href = 'sph.html';
        }

        renderTabel(dataSPH);
    </script>
</body>
</html>
