<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat SPH - Agung Jaya Listrik</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b0f17; font-family: system-ui, -apple-system, sans-serif; }
        .card-dark { background: rgba(17, 24, 38, 0.7); border: 1px solid rgba(255, 255, 255, 0.06); }
        .glass-input { background: rgba(13, 17, 23, 0.8); border: 1px solid rgba(255, 255, 255, 0.08); color: white; }
    </style>
</head>
<body class="min-h-screen text-slate-200">
    
    <!-- NAVBAR (Disamakan persis dengan Riwayat Invoice) -->
    <header class="border-b border-slate-800 bg-[#0b0f17]/90 backdrop-blur sticky top-0 z-50 px-6 py-3.5 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center overflow-hidden p-1 shadow">
                <img src="logoAJL.png" alt="Logo" class="w-full h-full object-contain">
            </div>
            <div>
                <h1 class="text-white font-bold text-sm tracking-wide">Agung Jaya Listrik</h1>
                <p class="text-[10px] text-slate-400">Invoice & Dokumen</p>
            </div>
        </div>
        <nav class="hidden md:flex items-center space-x-1 text-sm font-medium">
            <a href="dashboard.html" class="px-3 py-1.5 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/60 transition">Dashboard</a>
            <a href="riwayat-sph.html" class="px-3.5 py-1.5 rounded-lg bg-red-600/20 text-red-500 font-semibold border border-red-500/30">Riwayat SPH</a>
            <a href="riwayat-invoice.html" class="px-3 py-1.5 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/60 transition">Riwayat Invoice</a>
            <a href="riwayat-surat-jalan.html" class="px-3 py-1.5 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/60 transition">Riwayat Surat Jalan</a>
            <a href="riwayat-po.html" class="px-3 py-1.5 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/60 transition">Riwayat PO</a>
        </nav>
        <a href="index.html" class="px-3 py-1.5 rounded-lg card-dark text-xs text-slate-300 hover:text-white flex items-center space-x-2">
            <i class="fa-solid fa-right-from-bracket"></i><span>Logout</span>
        </a>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-8">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h2 class="text-2xl font-bold text-white tracking-tight">Riwayat Surat Penawaran Harga (SPH)</h2>
                <p class="text-xs text-slate-400 mt-1">Daftar penawaran harga yang telah dikirimkan ke customer</p>
            </div>
            <a href="sph.html" class="bg-rose-500 hover:bg-rose-600 text-white px-4 py-2.5 rounded-xl text-xs font-semibold transition flex items-center space-x-2">
                <i class="fa-solid fa-plus"></i><span>Buat SPH</span>
            </a>
        </div>

        <!-- Tabel Riwayat SPH -->
        <div class="card-dark rounded-2xl overflow-hidden border border-slate-800/80">
            <table class="w-full text-left border-collapse text-xs">
                <thead>
                    <tr class="border-b border-slate-800 text-slate-400 uppercase text-[10px] tracking-wider bg-slate-900/40">
                        <th class="py-4 px-6 w-16 text-center">#</th>
                        <th class="py-4 px-6">No. SPH</th>
                        <th class="py-4 px-6">Kepada (Customer)</th>
                        <th class="py-4 px-6">Tanggal</th>
                        <th class="py-4 px-6 text-center">Status</th>
                        <th class="py-4 px-6 text-center">Aksi & Konversi</th>
                    </tr>
                </thead>
                <tbody id="tabelRiwayatSPH" class="divide-y divide-slate-800/40 text-slate-300">
                    <!-- Data dimuat dari LocalStorage secara dinamis -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Modal Edit SPH -->
    <div id="modalEditSPH" class="hidden fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4">
        <div class="card-dark rounded-2xl w-full max-w-md p-6 bg-[#161b22]">
            <h3 class="text-lg font-bold mb-4 text-white">Edit Data SPH</h3>
            <input type="hidden" id="editIndex">
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block text-slate-400 mb-1">No. SPH</label>
                    <input type="text" id="editNoSPH" class="glass-input w-full rounded-xl px-3 py-2">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Nama Perusahaan / Customer</label>
                    <input type="text" id="editPerusahaan" class="glass-input w-full rounded-xl px-3 py-2">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Status</label>
                    <select id="editStatus" class="glass-input w-full rounded-xl px-3 py-2">
                        <option value="Menunggu">Menunggu</option>
                        <option value="Deal">Deal</option>
                        <option value="Cancel">Cancel</option>
                    </select>
                </div>
            </div>
            <div class="flex justify-end space-x-3 mt-6">
                <button onclick="tutupModalEdit()" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs">Batal</button>
                <button onclick="simpanEditSPH()" class="px-4 py-2 rounded-xl bg-rose-600 text-white text-xs font-semibold">Simpan Perubahan</button>
            </div>
        </div>
    </div>

    <script>
        let riwayatSPH = JSON.parse(localStorage.getItem('data_sph')) || [
            { id: 1, no: "001/10/SPH/2026", perusahaan: "PT. Mega Mitra Abadi", tanggal: "2026-10-25", status: "Deal" },
            { id: 2, no: "002/10/SPH/2026", perusahaan: "PT. Aloy Mandiri", tanggal: "2026-10-28", status: "Menunggu" }
        ];

        function renderTabelSPH() {
            const tbody = document.getElementById('tabelRiwayatSPH');
            if(riwayatSPH.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-slate-500">Belum ada riwayat SPH tersimpan.</td></tr>`;
                return;
            }

            tbody.innerHTML = riwayatSPH.map((item, index) => {
                let badgeColor = 'bg-amber-500/10 text-amber-400 border-amber-500/20';
                if(item.status === 'Deal') badgeColor = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';
                if(item.status === 'Cancel') badgeColor = 'bg-red-500/10 text-red-400 border-red-500/20';

                return `
                    <tr class="hover:bg-slate-800/30 transition">
                        <td class="py-4 px-6 text-center text-slate-500 font-mono">${index + 1}</td>
                        <td class="py-4 px-6 font-bold text-white">${item.no}</td>
                        <td class="py-4 px-6 font-medium text-slate-200">${item.perusahaan}</td>
                        <td class="py-4 px-6 text-slate-400">${item.tanggal || '-'}</td>
                        <td class="py-4 px-6 text-center">
                            <span class="${badgeColor} border px-2.5 py-1 rounded-full text-[10px] font-bold">${item.status || 'Menunggu'}</span>
                        </td>
                        <td class="py-4 px-6 text-center space-x-2">
                            <button onclick="ubahKeInvoice('${item.no}', '${item.perusahaan}')" title="Ubah ke Invoice" class="bg-indigo-600/20 hover:bg-indigo-600/40 text-indigo-400 border border-indigo-500/30 px-2.5 py-1 rounded-lg text-[11px] font-semibold transition">
                                <i class="fa-solid fa-file-invoice-dollar mr-1"></i> Ubah ke Invoice
                            </button>
                            <button onclick="bukaEdit(${index})" class="text-slate-400 hover:text-amber-400 p-1" title="Edit SPH"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button onclick="hapusSPH(${index})" class="text-slate-400 hover:text-red-400 p-1" title="Hapus"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function bukaEdit(index) {
            const item = riwayatSPH[index];
            document.getElementById('editIndex').value = index;
            document.getElementById('editNoSPH').value = item.no;
            document.getElementById('editPerusahaan').value = item.perusahaan;
            document.getElementById('editStatus').value = item.status || 'Menunggu';
            document.getElementById('modalEditSPH').classList.remove('hidden');
        }

        function tutupModalEdit() {
            document.getElementById('modalEditSPH').classList.add('hidden');
        }

        function simpanEditSPH() {
            const index = document.getElementById('editIndex').value;
            riwayatSPH[index].no = document.getElementById('editNoSPH').value;
            riwayatSPH[index].perusahaan = document.getElementById('editPerusahaan').value;
            riwayatSPH[index].status = document.getElementById('editStatus').value;

            localStorage.setItem('data_sph', JSON.stringify(riwayatSPH));
            tutupModalEdit();
            renderTabelSPH();
            alert('Data SPH berhasil diperbarui!');
        }

        function hapusSPH(index) {
            if(confirm('Yakin ingin menghapus riwayat SPH ini?')) {
                riwayatSPH.splice(index, 1);
                localStorage.setItem('data_sph', JSON.stringify(riwayatSPH));
                renderTabelSPH();
            }
        }

        function ubahKeInvoice(noSPH, perusahaan) {
            // Menyimpan data sementara ke localStorage agar form Invoice otomatis terisi
            const dataKonversi = { noSPH: noSPH, perusahaan: perusahaan };
            localStorage.setItem('konversi_sph_ke_invoice', JSON.stringify(dataKonversi));
            
            // Mengarahkan halaman ke form invoice.html
            window.location.href = 'invoice.html';
        }

        renderTabelSPH();
    </script>
</body>
</html>
